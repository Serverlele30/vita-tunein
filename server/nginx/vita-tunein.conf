log_format tunein '$time_iso8601 $remote_addr "$host" "$request" $status $body_bytes_sent up=$upstream_status "$http_user_agent"';

server {
    listen 80;
    server_name home.wayforward.com feed.tunein.com opml.radiotime.com feed.radiotime.com;
    access_log /data/logs/vita-tunein_access.log tunein;
    gzip off;
    chunked_transfer_encoding off;
    location / {
        proxy_pass http://127.0.0.1:8445;
        proxy_set_header Host $host;
        proxy_buffering on;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name tin.serverlele.de;
    ssl_certificate     /etc/letsencrypt/live/tin-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tin-rsa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA';
    include conf.d/include/letsencrypt-acme-challenge.conf;
    access_log /data/logs/vita-tunein_access.log tunein;
    gzip off;
    chunked_transfer_encoding off;
    location /stream {
        proxy_pass http://127.0.0.1:8445;
        proxy_set_header Host $host;
        proxy_set_header Icy-MetaData $http_icy_metadata;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:8445;
        proxy_set_header Host $host;
    }
}
